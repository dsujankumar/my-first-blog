<!DOCTYPE html>
<html>
    <head>
        <title>Sujan's Blog Homepage</title>
    </head>
    <body>
         <header>
            <h1><a href="/">My Blog</a></h1>
            <hr>
         </header>
         
         {% for post in posts %}
             <article>
               <time>published: {{ post.published_date }}</time>
               <h2>{{ post.author }}: <a href"">{{ post.title }}</a></h2>
               <p>{{ post.text|linebreaksbr }}</p>
               <hr>
             </article>
         {% endfor %}

    </body>
</html>
